<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Mohammed Banabilh. AI and machine learning products, shown as a solar system of projects.">
  <defs>
    <radialGradient id="sky" cx="72%" cy="45%" r="85%">
      <stop offset="0" stop-color="#2a1a5c"/><stop offset=".5" stop-color="#110e30"/><stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d8"/><stop offset=".35" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="20"/></clipPath>
    <!-- orbits: centred on the sun at (900,200), flattened by perspective -->
    <path id="o1" d="M 990 200 A 90 34 0 1 1 810 200 A 90 34 0 1 1 990 200"/>
    <path id="o2" d="M 1035 200 A 135 52 0 1 1 765 200 A 135 52 0 1 1 1035 200"/>
    <path id="o3" d="M 1080 200 A 180 70 0 1 1 720 200 A 180 70 0 1 1 1080 200"/>
    <path id="o4" d="M 1125 200 A 225 88 0 1 1 675 200 A 225 88 0 1 1 1125 200"/>
    <path id="o5" d="M 1170 200 A 270 106 0 1 1 630 200 A 270 106 0 1 1 1170 200"/>
    <path id="o6" d="M 1215 200 A 315 124 0 1 1 585 200 A 315 124 0 1 1 1215 200"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle cx="60" cy="40" r="1.2" opacity=".7"/><circle cx="180" cy="330" r="1" opacity=".6"/><circle cx="320" cy="70" r="1.4" opacity=".8"/>
      <circle cx="520" cy="360" r="1" opacity=".5"/><circle cx="610" cy="30" r="1.2" opacity=".7"/><circle cx="1240" cy="40" r="1.3" opacity=".8"/>
      <circle cx="1180" cy="370" r="1" opacity=".6"/><circle cx="760" cy="380" r="1.1" opacity=".6"/><circle cx="440" cy="200" r=".9" opacity=".5"/>
      <circle cx="35" cy="250" r="1" opacity=".5"/><circle cx="1260" cy="230" r="1" opacity=".6"/><circle cx="700" cy="60" r=".9" opacity=".5"/>
      <circle cx="560" cy="120" r="1.6" opacity=".9"><animate attributeName="opacity" values=".9;.2;.9" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="30" r="1.6" opacity=".9"><animate attributeName="opacity" values=".2;.9;.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="180" r="1.4" opacity=".9"><animate attributeName="opacity" values=".9;.3;.9" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- orbit lines -->
    <g fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="1.2">
      <use href="#o1"/><use href="#o2"/><use href="#o3"/><use href="#o4"/><use href="#o5"/><use href="#o6"/>
    </g>

    <!-- sun -->
    <circle cx="900" cy="200" r="78" fill="url(#glow)"><animate attributeName="r" values="74;84;74" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="200" r="30" fill="#fff4cf"/>

    <!-- planets: each project on its own orbit -->
    <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">
      <g><circle r="11" fill="#ff8a3d"/><circle r="11" fill="url(#shade)"/><text y="-17" text-anchor="middle">Nahem</text>
        <animateMotion dur="14s" repeatCount="indefinite" begin="-3s"><mpath href="#o1"/></animateMotion></g>
      <g><circle r="10" fill="#4fd1a5"/><circle r="10" fill="url(#shade)"/><text y="-16" text-anchor="middle">Show Me</text>
        <animateMotion dur="21s" repeatCount="indefinite" begin="-11s"><mpath href="#o2"/></animateMotion></g>
      <g><circle r="10" fill="#6cb8ff"/><circle r="10" fill="url(#shade)"/><text y="-16" text-anchor="middle">Seat Scout</text>
        <animateMotion dur="29s" repeatCount="indefinite" begin="-6s"><mpath href="#o3"/></animateMotion></g>
      <g><circle r="13" fill="#b49cff"/><circle r="13" fill="url(#shade)"/><text y="-19" text-anchor="middle">Ghost Bus</text>
        <g><rect x="-6" y="-3.5" width="12" height="7" rx="2" fill="#fff"/>
          <animateMotion dur="3s" repeatCount="indefinite" path="M 22 0 A 22 9 0 1 1 -22 0 A 22 9 0 1 1 22 0"/></g>
        <animateMotion dur="38s" repeatCount="indefinite" begin="-25s"><mpath href="#o4"/></animateMotion></g>
      <g><circle r="10" fill="#f08cff"/><circle r="10" fill="url(#shade)"/><text y="-16" text-anchor="middle">Football Butterfly</text>
        <animateMotion dur="47s" repeatCount="indefinite" begin="-14s"><mpath href="#o5"/></animateMotion></g>
      <g><circle r="9" fill="#ffd84d"/><circle r="9" fill="url(#shade)"/><text y="-15" text-anchor="middle">World Cup Chat</text>
        <animateMotion dur="58s" repeatCount="indefinite" begin="-40s"><mpath href="#o6"/></animateMotion></g>
    </g>

    <!-- name -->
    <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
      <text x="60" y="150" font-size="58" font-weight="800" fill="#fff" letter-spacing="-1.5">Mohammed</text>
      <text x="60" y="212" font-size="58" font-weight="800" fill="#fff" letter-spacing="-1.5">Banabilh</text>
      <text x="62" y="262" font-size="21" font-weight="600" fill="#b49cff">AI &amp; machine learning, in Arabic and English</text>
      <text x="62" y="300" font-size="16" fill="#fff" fill-opacity=".7">Every planet is a project I built and shipped.</text>
    </g>
  </g>
</svg>
