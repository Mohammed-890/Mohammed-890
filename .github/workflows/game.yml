name: Bus game
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: profile-readme
  cancel-in-progress: false
jobs:
  guess:
    if: startsWith(github.event.issue.title, 'ghostbus:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score the guess
        env:
          TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/game.py answer "$TITLE" > reply.md
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file reply.md
          gh issue close "$N" --repo "$GITHUB_REPOSITORY"
      - name: Update the scoreboard
        run: |
          git config user.name "Mohammed Banabilh"
          git config user.email "181735426+Mohammed-890@users.noreply.github.com"
          git add README.md game
          git diff --cached --quiet || (git commit -qm "Bus game: scoreboard" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done)
