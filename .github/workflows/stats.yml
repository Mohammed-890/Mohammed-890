name: Refresh live stats and today's bus
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-readme
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_stats.py
      - run: python3 scripts/game.py new
      - name: Commit if changed
        run: |
          git config user.name "Mohammed Banabilh"
          git config user.email "181735426+Mohammed-890@users.noreply.github.com"
          git add -A assets README.md game
          git diff --cached --quiet || (git commit -qm "Refresh live stats and today's bus" && git push -q)
